        highlights:
          - Analyzed Reliable Policy Iteration and its Bellman-feasibility and monotonic-improvement properties for mitigating instability in approximate policy iteration with linear function approximation.
          - Built a scalable sampled RPI method using Kaczmarz–Motzkin projections and benchmarked it against AMPI-Q, CPI, TRPO and SAC on control environments such as inventory control and Tetris.

      - company: Stochastic Control Lab, IIIT Bangalore
        position: Research Scholar (Advisor - Prof. Raghuram Bharadwaj Diddigi)
        location: Bengaluru, India
        start_date: 2023-08
        end_date: 2026-07
        highlights:
          - Developed a Gaussian Mixture Q-Network for uncertainty-aware value estimation, with stable responsibility computations and mixture-weight updates, evaluated against DQN and MoE-based baselines.
          - Proposed CLIP-RL, a transfer framework that aligns natural-language instructions with RL policy weights in a shared embedding space to retrieve and transfer expert behaviours.

      - company: IBM Research India
        position: AI Research Intern
        location: Bengaluru, India
        start_date: 2025-05
        end_date: 2025-07
        highlights:
          - Built an offline-RL pipeline that generates diverse, multimodal trajectories via return-based binning and rejection sampling, for single- and multi-objective rewards in D4RL format.
          - Trained and evaluated Decision Transformer and Elastic Decision Transformer models, including multi-objective extensions and Pareto-front analysis.

      - company: Centre for Artificial Intelligence and Robotics (CAIR), DRDO
        position: Research Intern
        location: Bengaluru, India
        start_date: 2022-09
        end_date: 2023-05
        highlights:
          - Built a benchmark of drone imagery converted from day to low light for evaluating object detection and tracking.
          - Integrated the SiamRPN++ tracker with TLD and low-light enhancement models such as EnlightenGAN to improve tracking under extreme illumination.

